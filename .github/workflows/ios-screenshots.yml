name: iOS screenshots

# Runs the app in the iPhone simulator with the mock radio (USE_MOCK flipped
# in this checkout only, never committed), taps through every screen with
# Maestro and uploads the screenshots. For design review, not a test gate.

on:
  pull_request:
    paths:
      - '.maestro/**'
      - '.github/workflows/ios-screenshots.yml'
  workflow_dispatch:

concurrency:
  group: ios-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the mock radio (this checkout only)
        run: |
          sed -i '' 's/export const USE_MOCK = false;/export const USE_MOCK = true;/' src/services/ble/BleManager.ts
          grep -q 'USE_MOCK = true' src/services/ble/BleManager.ts
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1
      - name: Build (Release, simulator, JS bundled)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RNDVU.xcworkspace -scheme RNDVU \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee xcodebuild.log | xcbeautify --renderer github-actions
      - name: Boot an iPhone
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          print(c[-1]['udid'])")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 21:41 --batteryLevel 84 --cellularBars 3 --wifiBars 2
          xcrun simctl location "$udid" set 33.6801,-116.2372
          xcrun simctl install "$udid" "$(ls -d build/Build/Products/Release-iphonesimulator/RNDVU.app)"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Tap through the app
        run: maestro --device "$UDID" test .maestro/screens.yaml --test-output-dir maestro-out
        continue-on-error: true
      - name: Last screen
        if: always()
        run: xcrun simctl io "$UDID" screenshot shots/99-last-screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots
            maestro-out
            ~/.maestro/tests
